# Pages CMS config for learningwala.in (Hugo + hugo-bearcub)
# Place at the repository root. Adjust paths if your folders differ.

media:
  input: assets
  output: /assets

content:
  # Blog posts and weekly notes (distinguished by tags)
  - name: blog
    label: Blog
    type: collection
    path: content/blog
    filename: "{primary}.md"
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: date
        default: now
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: description
        label: Description
        type: text
      - name: tags
        label: Tags
        type: string
        list: true
        description: Use "blog" for posts and "weekly-notes" for weekly notes (these drive your menu).
      - name: body
        label: Body
        type: rich-text

  # Single pages linked from your About menu
  - name: about-me
    label: About me
    type: file
    path: content/about-me.md
    fields:
      - name: title
        type: string
      - name: body
        type: rich-text

  - name: writings
    label: Writings
    type: file
    path: content/writings.md
    fields:
      - name: title
        type: string
      - name: body
        type: rich-text

  - name: media-page
    label: Media
    type: file
    path: content/media.md
    fields:
      - name: title
        type: string
      - name: body
        type: rich-text