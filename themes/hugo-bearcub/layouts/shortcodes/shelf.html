{{- /*
  A scrolling row of book covers. Put {{< shelfbook >}} items inside.
  Optional param: label (screen reader name for the row).
  Swipe, drag, use the mouse wheel or the arrow buttons.
*/ -}}
<div class="bks" data-bks>
  <div class="bks-wide">
    <div class="bks-track" role="group" aria-label="{{ .Get "label" | default "Books" }}">
{{ .Inner }}
      <span class="bks-end" aria-hidden="true"></span>
    </div>
  </div>
  <div class="bks-nav">
    <button type="button" class="bks-btn bks-prev" aria-label="Scroll left">&lsaquo;</button>
    <button type="button" class="bks-btn bks-next" aria-label="Scroll right">&rsaquo;</button>
  </div>
</div>
{{- if not (.Page.Scratch.Get "bks-js") }}
{{- .Page.Scratch.Set "bks-js" true }}
<style>
.bks{position:relative;margin:1.5rem 0}
.bks-track{display:flex;gap:1.25rem;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:.25rem 0 .75rem;scrollbar-width:thin;cursor:grab;
  -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.bks.is-drag .bks-track{cursor:grabbing;scroll-snap-type:none;user-select:none}
.bks-end{flex:0 0 1px}

.bks .bks-book{flex:0 0 auto;display:flex;flex-direction:column;gap:.2rem;
  width:max-content;scroll-snap-align:start;text-decoration:none;color:inherit}
.bks .bks-book img{height:240px;width:auto;max-width:none;display:block;
  border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,.2);user-select:none}
/* width:0 + min-width:100% makes the text wrap to the cover's width instead of stretching the item */
.bks .bks-t,.bks .bks-m{display:block;width:0;min-width:100%}
.bks .bks-t{font-weight:600;margin-top:.4rem;line-height:1.25}
.bks .bks-m{font-size:.8em;opacity:.65;line-height:1.3}

.bks-nav{display:none}
.bks.is-js .bks-nav{display:flex;gap:.5rem;justify-content:flex-end}
.bks-btn{width:2.2rem;height:2.2rem;border-radius:50%;border:1px solid currentColor;
  background:transparent;color:inherit;font-size:1.3rem;line-height:1;cursor:pointer;padding:0}
.bks-btn:disabled{opacity:.25;cursor:default}
</style>
<script>
function bksInit() {
  var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  [].slice.call(document.querySelectorAll('[data-bks]')).forEach(function (sh) {
    if (sh.dataset.bksReady) return;
    sh.dataset.bksReady = '1';
    var track = sh.querySelector('.bks-track'),
        pv = sh.querySelector('.bks-prev'),
        nx = sh.querySelector('.bks-next');
    sh.classList.add('is-js');

    function max() { return Math.max(track.scrollWidth - track.clientWidth, 0); }
    function edge() {
      var l = track.scrollLeft, m = max();
      pv.disabled = l <= 4;
      nx.disabled = l >= m - 4;
      sh.classList.toggle('at-end', l >= m - 4);
    }
    function step(d) {
      track.scrollBy({ left: d * Math.max(track.clientWidth * 0.7, 200), behavior: reduce ? 'auto' : 'smooth' });
    }
    pv.addEventListener('click', function () { step(-1); });
    nx.addEventListener('click', function () { step(1); });
    track.addEventListener('scroll', edge, { passive: true });
    window.addEventListener('resize', edge);
    window.addEventListener('load', edge);
    edge();
    track.addEventListener('dragstart', function (e) { e.preventDefault(); });
    track.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    });

    /* the mouse wheel scrolls the row sideways, then lets the page scroll at the ends */
    var wLast = 0;
    track.addEventListener('wheel', function (e) {
      if (e.ctrlKey || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      var dy = e.deltaMode === 1 ? e.deltaY * 32 : e.deltaY, now = Date.now();
      var can = (dy > 0 && track.scrollLeft < max() - 1) || (dy < 0 && track.scrollLeft > 0);
      if (!can && now - wLast > 250) return;
      e.preventDefault();
      wLast = now;
      track.scrollLeft += dy;
    }, { passive: false });

    /* drag with the mouse */
    var down = false, moved = false, x0 = 0, l0 = 0;
    track.addEventListener('pointerdown', function (e) {
      if (e.pointerType !== 'mouse' || e.button !== 0) return;
      down = true; moved = false; x0 = e.clientX; l0 = track.scrollLeft;
    });
    window.addEventListener('pointermove', function (e) {
      if (!down) return;
      var dx = e.clientX - x0;
      if (!moved && Math.abs(dx) > 5) { moved = true; sh.classList.add('is-drag'); }
      if (moved) track.scrollLeft = l0 - dx;
    });
    function end() {
      if (!down) return;
      down = false;
      if (moved) sh.classList.remove('is-drag');
    }
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);
    track.addEventListener('click', function (e) {
      if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; }
    }, true);
  });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bksInit);
else bksInit();
</script>
{{- end }}
