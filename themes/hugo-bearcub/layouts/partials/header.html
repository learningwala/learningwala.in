<header class="site-header">
  <div class="brand">
    <a class="brand-en" href="{{ "/" | relURL }}">Mihir Pathak</a>
    <span class="brand-sep" aria-hidden="true"></span>
  </div>

  <nav class="site-nav" aria-label="Main">
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle menu"><span></span></label>

    <ul class="menu">
      {{ $page := . }}
      {{ range site.Menus.main }}
        {{ if .HasChildren }}
          <li class="menu-item has-children">
            <a href="{{ .URL }}"{{ if or ($page.IsMenuCurrent "main" .) ($page.HasMenuCurrent "main" .) }} class="active"{{ end }}>{{ .Name }}</a>
            <ul class="submenu">
              {{ range .Children }}
                <li><a href="{{ .URL }}"{{ if $page.IsMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a></li>
              {{ end }}
            </ul>
          </li>
        {{ else }}
          <li class="menu-item">
            <a href="{{ .URL }}"{{ if $page.IsMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a>
          </li>
        {{ end }}
      {{ end }}
      <li class="menu-item menu-search">
  <pagefind-modal-trigger compact hide-shortcut></pagefind-modal-trigger>
</li>
    </ul>
  </nav>
</header>
