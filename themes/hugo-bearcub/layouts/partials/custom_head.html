<title>
  {{ if .IsHome }}
    {{ .Site.Title }}
  {{ else }}
    {{ .Title }} | {{ .Site.Title }}
  {{ end }}
</title>

{{ with .Site.Params.favicon }}
<link rel="shortcut icon" href="{{ absURL . }}" type="image/png" />
{{ end }}

<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
