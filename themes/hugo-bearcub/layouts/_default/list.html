{{ define "main" }}
<div class="list-head">
  <h1 class="list-label">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"></path>
      <path d="M15 5l4 4"></path>
    </svg>
    {{ .Title }}
  </h1>

  {{ with .OutputFormats.Get "rss" }}
  <a class="list-rss" href="{{ .RelPermalink }}" aria-label="RSS feed">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 11a9 9 0 0 1 9 9"></path>
      <path d="M4 4a16 16 0 0 1 16 16"></path>
      <circle cx="5" cy="19" r="1"></circle>
    </svg>
  </a>
  {{ end }}
</div>

{{ with .Content }}<div class="list-intro">{{ . }}</div>{{ end }}

{{ range .Pages.GroupByDate "2006" }}
<section class="year-group">
  <h2 class="year">{{ .Key }}<sup>({{ len .Pages }})</sup></h2>
  <ul class="post-list">
    {{ range .Pages }}
    <li>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 02" }}</time>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
    {{ end }}
  </ul>
</section>
{{ end }}
{{ end }}
