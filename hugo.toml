baseURL = 'https://learningwala.in/'
theme = "hugo-bearcub"
title = "Mihir Pathak | મિહિર પાઠક"
copyright = "Mihir Pathak (CC BY-NC-SA 4.0)"
defaultContentLanguage = "en"
languageCode = "en-US"

# Generate a nice robots.txt for SEO
enableRobotsTXT = true

# Setup syntax highlighting without inline styles
[markup]
  [markup.highlight]
    lineNos = true
    lineNumbersInTable = false
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true  # Allow raw HTML rendering in Markdown

[params]
  description = "Mihir Pathak"
  # Favicon path
  favicon = "images/favicon.png"
  # Social preview images
  images = ["images/share.webp"]
  # Date format
  dateFormat = "2006-01-02"
  # Theme style
  themeStyle = "herman"
  # Social card generation
  generateSocialCard = true
  # Made with
  madeWith = "Made with [Bear Cub](https://github.com/clente/hugo-bearcub)"
  
  # Social media
  [params.social]
    twitter = "example"
    facebook_admin = "0000000000"
  
  # Author metadata
  [params.author]
    name = "Mihir Pathak"
    email = ""
  
  # Cloudinary config
  [params.cloudinary]
    cloud_name = "dfk2wsrhz"
    upload_preset = ""
  
  # Custom styles and fonts
  [params.styles]
    custom_css = ["css/style.css"]

[imaging]
  formats = ["webp", "jpg", "png"]
  quality = 85
  resampleFilter = "lanczos"
  anchor = "smart"

[imaging.exif]
  includeFields = ""
  excludeFields = ""
  disableDate = false
  disableLatLong = true

