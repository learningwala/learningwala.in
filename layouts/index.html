{{ define "main" }}
<section class="intro">
  {{ with .Params.photo }}
    <figure class="intro-banner">
      <img src="{{ . | relURL }}" alt="{{ $.Params.photo_alt }}"  width="700" height="394"   >
            {{ with $.Params.photo_caption }}<figcaption>{{ . }}</figcaption>{{ end }}
    </figure>
  {{ end }}

  <div class="intro-text">
    {{ with .Params.tagline }}<h1 class="hero-line">{{ . }}</h1>{{ end }}
    
    <div class="abstract">
      {{ .Content }}
    </div>
  </div>
</section>
{{ end }}
